[project]
name = "mesh-xml"
version = "0.1.0"
description = ""
authors = [
    {name = "AspectWaltz",email = "Aravind.Sundararajan@protonmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pyside6 (>=6.9.1,<7.0.0)",
    "numpy (>=1.24.0,<2.0.0)",
    "PyOpenGL (>=3.1.0,<4.0.0)",
    "pyqtgraph (>=0.13.7,<0.14.0)",
    "qtawesome (>=1.4.2,<2.0.0)"
]

[project.scripts]
mesh-xml = "mesh_xml.editor.app:main"

[tool.poetry]

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.4"
pytest = "^8.4.1"
imageio = "^2.37.4"
imageio-ffmpeg = "^0.6.0"

[tool.pytest.ini_options]
# Scoped to tests/ so pytest does not collect the legacy root-level test_*.py
# scripts, two of which open Qt windows on import.
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
